# Worker Cloudflare « site » : sert le site statique (dist/) et l'API des formulaires.
name = "site"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Bucket R2 qui reçoit les formulaires (contact et demandes de rendez-vous).
[[r2_buckets]]
binding = "FORMS"
bucket_name = "databasesite"

# Envoi des demandes par e-mail (Cloudflare Email Routing).
# L'adresse de destination doit être vérifiée dans Email Routing.
[[send_email]]
name = "MAILER"
destination_address = "odeondentaire@gmail.com"
