# Configuration Cloudflare Pages (projet « odeon-dentaire »)
name = "odeon-dentaire"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Bucket R2 qui reçoit les formulaires (contact et demandes de rendez-vous).
# Bucket R2 du compte Cloudflare : databasesite
[[r2_buckets]]
binding = "FORMS"
bucket_name = "databasesite"
